name: Build Single App

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Iskaan Dashboard (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build Windows Executable
        shell: powershell
        run: |
          $scriptPath = Join-Path "${{ github.workspace }}" "iskaan-toggle.js"
          pake https://visitor.iskaan.com/dashboard --name "Iskaan Dashboard" --inject "$scriptPath" --width 1400 --height 900

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Iskaan-Dashboard-Windows
          path: |
            *.exe
            *.msi
            output/*
            dist/*
            **/*.exe
            **/*.msi
