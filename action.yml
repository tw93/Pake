name: "Pake Web App Builder"
description: "Transform any webpage into a lightweight desktop app using Rust and Tauri"
author: "tw93"
branding:
  icon: "package"
  color: "blue"

inputs:
  url:
    description: "Target URL to package"
    required: true

  name:
    description: "Application name"
    required: true

  output-dir:
    description: "Output directory for packages"
    required: false
    default: "dist"

  icon:
    description: "Custom app icon URL or path"
    required: false

  width:
    description: "Window width"
    required: false
    default: "1200"

  height:
    description: "Window height"
    required: false
    default: "780"

  debug:
    description: "Enable debug mode"
    required: false
    default: "false"

outputs:
  package-path:
    description: "Path to the generated package"
    value: ${{ steps.build.outputs.package-path }}

runs:
  using: "composite"
  steps:
    - name: Setup Environment
      shell: bash
      run: |
        # Install Node.js dependencies
        npm install

        # Build Pake CLI if not exists
        if [ ! -f "dist/cli.js" ]; then
          npm run cli:build
        fi

        # Install Rust/Cargo if needed
        if ! command -v cargo &> /dev/null; then
          rustup_init="$(mktemp)"
          trap 'rm -f "$rustup_init"' EXIT
          curl --proto '=https' --tlsv1.2 -sSf -o "$rustup_init" https://sh.rustup.rs
          sh "$rustup_init" -y
          source ~/.cargo/env
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi

    - name: Build Pake App
      id: build
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_ICON: ${{ inputs.icon }}
        INPUT_WIDTH: ${{ inputs.width }}
        INPUT_HEIGHT: ${{ inputs.height }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        if [[ "$INPUT_OUTPUT_DIR" == *$'\n'* || "$INPUT_OUTPUT_DIR" == *$'\r'* ]]; then
          echo "❌ Output directory must not contain line breaks" >&2
          exit 1
        fi

        # Build arguments
        ARGS=("$INPUT_URL")

        ARGS+=("--name" "$INPUT_NAME")

        if [ -n "$INPUT_ICON" ]; then
          ARGS+=("--icon" "$INPUT_ICON")
        fi

        ARGS+=("--width" "$INPUT_WIDTH")
        ARGS+=("--height" "$INPUT_HEIGHT")

        if [ "$INPUT_DEBUG" == "true" ]; then
          ARGS+=("--debug")
        fi

        # Create output directory
        mkdir -p -- "$INPUT_OUTPUT_DIR"
        export PAKE_CREATE_APP=1

        # Run Pake CLI
        printf '🔧 Running:'
        printf ' %q' node dist/cli.js "${ARGS[@]}"
        printf '\n'
        node dist/cli.js "${ARGS[@]}"

        # Find generated package and set output
        PACKAGE=$(find src-tauri/target -type f \( -name "*.deb" -o -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \) 2>/dev/null | head -1)

        # If no file packages found, look for .app directory (macOS)
        if [ -z "$PACKAGE" ]; then
          PACKAGE=$(find src-tauri/target -type d -name "*.app" 2>/dev/null | head -1)
        fi
        if [ -n "$PACKAGE" ]; then
          # Move to output directory
          BASENAME=$(basename "$PACKAGE")
          PACKAGE_PATH="$INPUT_OUTPUT_DIR/$BASENAME"
          if [[ "$PACKAGE_PATH" == *$'\n'* || "$PACKAGE_PATH" == *$'\r'* ]]; then
            echo "❌ Package path must not contain line breaks" >&2
            exit 1
          fi
          mv -- "$PACKAGE" "$PACKAGE_PATH" 2>/dev/null || cp -r -- "$PACKAGE" "$PACKAGE_PATH"
          printf 'package-path=%s\n' "$PACKAGE_PATH" >> "$GITHUB_OUTPUT"
          printf '✅ Package created: %s\n' "$PACKAGE_PATH"
        else
          echo "❌ No package found"
          exit 1
        fi
